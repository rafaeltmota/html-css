<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
</head>
<body>
    <h1>Testanto o uso de um iframe</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com/" target="_blank">CursoemVideo</a> para aprender a programar.</p>

    <p>
        Acessando o site do 

        <iframe src="https://www.cursoemvideo.com/" frameborder="0"></iframe>
        
        para aprender a programar.</p>

    <p>O site do 
        <iframe src="https://www.google.com/" frameborder="0"></iframe>
         também é muito legal, pena que não funciona dentro do iframe.</p>

    <p>O respositório do Guanabara <iframe src="https://gustavoguanabara.github.io/" frameborder="0"></iframe> também é bem legal!</p>
</body>
</html>
