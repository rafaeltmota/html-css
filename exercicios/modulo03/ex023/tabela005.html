<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome {
            background-color: greenyellow;
        }

        col.csexo, col.cidade {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Maria Sophia</td>
            <td>F</td>
            <td>11</td>
            <td>Artista</td>
        </tr>
        <tr>
            <td>Rafael Davi</td>
            <td>M</td>
            <td>9</td>
            <td>Jogador de Futebol</td>
        </tr>
        <tr>
            <td>Maria Ozélia</td>
            <td>F</td>
            <td>65</td>
            <td>Professora</td>
        </tr>
        <tr>
            <td>Lariassa Mota</td>
            <td>F</td>
            <td>29</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>João Guilherme</td>
            <td>M</td>
            <td>20</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Kelma Viana</td>
            <td>F</td>
            <td>45</td>
            <td>Artista</td>
        </tr>
    </table>
    
</body>
</html>
